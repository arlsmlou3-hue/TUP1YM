    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Run Bot
        env:
          HIGHRISE_API_TOKEN: f3f72b7929ffbaca61165d5e76e654c2c4dd8f2b01a15b032d811c83a74f9948
          HIGHRISE_ROOM_ID: https://high.rs/world?id=6894bd39e3e4a405517cb530&ownedRoomId=6adf9c03e883131eaa4bc47a&invite_id=6ae892c9c349ecc3db1a6b07
        run: python main.py
